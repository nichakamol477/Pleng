<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Video 💗</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #ffeef5);

    display: flex;
    justify-content: center;
    align-items: center;

    padding: clamp(16px, 4vw, 40px);

    overflow-x: hidden;
}

/* =========================
   Hearts
========================= */

.hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.heart {
    position: absolute;
    font-size: clamp(18px, 4vw, 30px);
    opacity: 0.5;
    animation: float 6s infinite ease-in-out;
}

.heart:nth-child(1) {
    left: 8%;
    top: 15%;
}

.heart:nth-child(2) {
    right: 10%;
    top: 25%;
    animation-delay: 1s;
}

.heart:nth-child(3) {
    left: 15%;
    bottom: 15%;
    animation-delay: 2s;
}

.heart:nth-child(4) {
    right: 15%;
    bottom: 20%;
    animation-delay: 3s;
}

@keyframes float {
    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-15px);
    }
}

/* =========================
   Main
========================= */

.container {
    position: relative;
    z-index: 1;

    width: 100%;
    max-width: 700px;

    text-align: center;
}

/* =========================
   Title
========================= */

h1 {
    margin: 0 0 clamp(8px, 2vw, 12px);

    color: #d94f7c;

    font-size: clamp(28px, 7vw, 46px);

    line-height: 1.2;
}

.subtitle {
    margin-bottom: clamp(18px, 4vw, 28px);

    color: #8f536b;

    font-size: clamp(14px, 3.5vw, 19px);

    line-height: 1.5;
}

/* =========================
   Video Card
========================= */

.video-card {
    width: 100%;

    padding: clamp(12px, 4vw, 26px);

    background: rgba(255, 255, 255, 0.78);

    border-radius: clamp(18px, 5vw, 30px);

    box-shadow:
        0 12px 30px rgba(170, 70, 100, 0.18);

    backdrop-filter: blur(8px);
}

/* =========================
   Videos
========================= */

video {
    display: block;

    width: 100%;
    max-width: 100%;

    height: auto;

    margin: 0 auto;

    background: #000;

    border-radius: clamp(12px, 4vw, 24px);

    box-shadow:
        0 8px 20px rgba(170, 70, 100, 0.18);
}

/* =========================
   Button
========================= */

.go-button {
    display: block;

    width: min(100%, 400px);

    margin: clamp(18px, 4vw, 24px) auto 0;

    padding:
        clamp(12px, 3vw, 16px)
        clamp(20px, 5vw, 32px);

    border: none;

    border-radius: 999px;

    background: #e96b95;

    color: white;

    font-size: clamp(15px, 4vw, 20px);

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 7px 18px rgba(217, 79, 124, 0.25);

    transition: 0.2s;
}

.go-button:hover {
    background: #df5b88;
    transform: translateY(-2px);
}

.go-button:active {
    transform: scale(0.97);
}

/* =========================
   Second Video
   ซ่อนไว้ตั้งแต่เริ่ม
========================= */

.second-video {
    display: none;

    width: 100%;

    margin-top: clamp(24px, 5vw, 34px);
}

.second-video.show {
    display: block;
}

.second-title {
    margin-bottom: clamp(10px, 3vw, 16px);

    color: #d94f7c;

    font-size: clamp(18px, 5vw, 26px);

    font-weight: bold;
}

/* =========================
   Mobile
========================= */

@media (max-width: 480px) {

    body {
        padding: 14px 10px;
    }

    .container {
        max-width: 100%;
    }

    .video-card {
        padding: 10px;
        border-radius: 20px;
    }

    video {
        border-radius: 14px;
    }

    .go-button {
        width: 100%;
        min-height: 48px;
    }
}

/* =========================
   Tablet
========================= */

@media (min-width: 481px) and (max-width: 900px) {

    .container {
        max-width: 650px;
    }
}

/* =========================
   Desktop
========================= */

@media (min-width: 901px) {

    .container {
        max-width: 700px;
    }
}
</style>
</head>

<body>

<!-- ตกแต่งหัวใจ -->
<div class="hearts">
    <div class="heart">💗</div>
    <div class="heart">💕</div>
    <div class="heart">💗</div>
    <div class="heart">💕</div>
</div>


<div class="container">

    <h1>🎬 Our Video</h1>

    <div class="subtitle">
        มาดูวิดีโอของเรากัน 💗
    </div>


    <div class="video-card">

        <!-- =================================
             คลิปแรก
        ================================== -->

        <video
            controls
            playsinline
            preload="metadata"
        >
            <source
                src="lv_7516543208210304309_20260928235152.mp4"
                type="video/mp4"
            >

            เบราว์เซอร์นี้ไม่รองรับวิดีโอ
        </video>


        <!-- =================================
             ปุ่มไปคลิปที่สอง
        ================================== -->

        <button
            type="button"
            class="go-button"
            onclick="startNextVideo()"
        >
            เริ่มกันเลย Go Go Go🚗
        </button>


        <!-- =================================
             คลิปที่สอง
             ตอนเปิดหน้าจะยังไม่เห็น
        ================================== -->

        <div
            class="second-video"
            id="secondVideo"
        >

            <div class="second-title">
                💗 Go Go Go!
            </div>


            <video
                id="nextVideo"
                controls
                playsinline
                preload="metadata"
            >

                <source
                    src="2026-09-29-002646744.mp4"
                    type="video/mp4"
                >

                เบราว์เซอร์นี้ไม่รองรับวิดีโอ

            </video>

        </div>

    </div>

</div>


<script>

function startNextVideo() {

    /* หาองค์ประกอบคลิปที่สอง */
    const secondVideo =
        document.getElementById("secondVideo");

    const video =
        document.getElementById("nextVideo");


    /* ทำให้คลิปที่สองปรากฏ */
    secondVideo.classList.add("show");


    /* เลื่อนไปหาคลิปที่สอง */
    secondVideo.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });


    /* เล่นคลิปที่สอง */
    video.play().catch(() => {
        /* ถ้าเบราว์เซอร์ไม่อนุญาต autoplay
           ผู้ใช้สามารถกดปุ่ม Play ในวิดีโอได้ */
    });

}

</script>

</body>
</html>
