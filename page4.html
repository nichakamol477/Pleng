<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>🎬 วิดีโอของเรา</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100dvh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: clamp(16px, 4vw, 40px);

    background:
        linear-gradient(
            135deg,
            #ffd6e5,
            #fff0f5,
            #ffc6dc
        );

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: #7b4055;
}


/* =========================
   MAIN
========================= */

.container {
    width: min(100%, 650px);
    text-align: center;
}


/* =========================
   TITLE
========================= */

h1 {
    margin: 0 0 clamp(10px, 2vw, 16px);

    font-size: clamp(24px, 6vw, 38px);

    color: #d6537c;
}

.subtitle {
    margin-bottom: clamp(18px, 4vw, 28px);

    font-size: clamp(14px, 3.5vw, 18px);
}


/* =========================
   VIDEO
========================= */

.video-box {
    width: 100%;

    background: #000;

    border-radius: clamp(16px, 4vw, 28px);

    overflow: hidden;

    box-shadow:
        0 12px 35px
        rgba(170, 70, 100, 0.22);
}

video {
    display: block;

    width: 100%;
    height: auto;

    max-height: 70dvh;

    object-fit: contain;

    background: #000;
}


/* =========================
   BUTTON
========================= */

.start-button,
.continue-button {

    border: none;

    border-radius: 999px;

    padding:
        clamp(12px, 3vw, 16px)
        clamp(22px, 6vw, 34px);

    margin-top: clamp(18px, 4vw, 26px);

    background:
        linear-gradient(
            135deg,
            #f27da6,
            #d9537d
        );

    color: white;

    font-size: clamp(14px, 3.5vw, 18px);

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 8px 20px
        rgba(210, 75, 115, 0.25);

    transition:
        transform 0.2s ease;
}

.start-button:active,
.continue-button:active {
    transform: scale(0.96);
}


/* =========================
   SECOND VIDEO
========================= */

#video2-section {
    display: none;

    margin-top: clamp(20px, 5vw, 30px);
}


/* =========================
   FINAL MESSAGE
========================= */

#finalMessage {
    display: none;

    margin-top: clamp(20px, 5vw, 30px);

    animation:
        fadeIn 0.8s ease;
}

#finalMessage h2 {

    margin-bottom: 10px;

    color: #d6537c;

    font-size: clamp(21px, 5vw, 30px);
}

#finalMessage p {

    margin: 6px 0;

    font-size: clamp(14px, 3.5vw, 18px);

    line-height: 1.7;
}


/* =========================
   CONTINUE BUTTON
========================= */

.continue-button {
    display: none;
}


/* =========================
   ANIMATION
========================= */

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* =========================
   SMALL SCREEN
========================= */

@media (max-width: 480px) {

    body {
        padding: 18px;
    }

    video {
        max-height: 65dvh;
    }

}


/* =========================
   LANDSCAPE
========================= */

@media (orientation: landscape) {

    body {
        padding: 12px;
    }

    video {
        max-height: 68dvh;
    }

}

</style>

</head>


<body>


<div class="container">


    <h1>🎬 วิดีโอของเรา</h1>

    <div class="subtitle">
        พร้อมดูแล้วใช่ไหมคะ 💗
    </div>


    <!-- VIDEO 1 -->

    <div class="video-box">

        <video
            id="video1"
            controls
            playsinline
            preload="metadata"
        >

            <source
                src="lv_7516543208210304309_20260928235152.mp4"
                type="video/mp4"
            >

            เบราว์เซอร์นี้ไม่รองรับวิดีโอ

        </video>

    </div>


    <button
        id="startButton"
        class="start-button"
        onclick="startSecondVideo()"
    >
        เริ่มกันเลย Go Go Go🚗
    </button>


    <!-- VIDEO 2 -->

    <div id="video2-section">

        <div class="video-box">

            <video
                id="video2"
                controls
                playsinline
                preload="metadata"
            >

                <source
                    src="2026-09-29-002646744.mp4"
                    type="video/mp4"
                >

                เบราว์เซอร์นี้ไม่รองรับวิดีโอ

            </video>

        </div>


        <!-- FINAL MESSAGE -->

        <div id="finalMessage">

            <h2>
                เย้ คลิปจบแล้ว 💗
            </h2>

            <p>
                ถึงจะสั้น ๆ แต่มีความหมายสำหรับเค้ามากนะคะ
            </p>

            <p>
                เค้าตั้งใจทำมันให้เธอเลยนะคะ😝
            </p>


            <!-- CONTINUE BUTTON -->

            <button
                id="continueButton"
                class="continue-button"
                onclick="goToFinalVideo()"
            >
                ดูต่ออีกนิด
            </button>

        </div>

    </div>

</div>


<script>


/* =========================
   ELEMENTS
========================= */

const video1 =
    document.getElementById("video1");

const video2 =
    document.getElementById("video2");

const video2Section =
    document.getElementById("video2-section");

const finalMessage =
    document.getElementById("finalMessage");

const startButton =
    document.getElementById("startButton");

const continueButton =
    document.getElementById("continueButton");


/* =========================
   START VIDEO 2
========================= */

function startSecondVideo() {

    video2Section.style.display = "block";

    startButton.style.display = "none";

    video2.currentTime = 0;

    video2.play().catch(function () {});

    setTimeout(function () {

        video2.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }, 150);

}


/* =========================
   VIDEO 2 จบ
========================= */

video2.addEventListener("ended", function () {

    finalMessage.style.display = "block";

    continueButton.style.display = "inline-block";

    setTimeout(function () {

        finalMessage.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }, 100);

});


/* =========================
   ไปวิดีโอสุดท้าย
========================= */

function goToFinalVideo() {

    window.location.href =
        "page4-final.html";

}

</script>


</body>

</html>
