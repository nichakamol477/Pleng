<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>💗</title>

<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    width: 100dvw;
    height: 100dvh;

    margin: 0;
    padding: 0;

    background: #000;

    overflow: hidden;
}


/* =========================
   BODY
========================= */

body {

    display: flex;

    align-items: center;

    justify-content: center;

}


/* =========================
   VIDEO
========================= */

#finalVideo {

    display: block;

    width: 100dvw;
    height: 100dvh;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;

    object-position: center;

    background: #000;

}


/* =========================
   BACK BUTTON
========================= */

.back-button {

    position: fixed;

    left: 50%;

    bottom:
        calc(24px + env(safe-area-inset-bottom));

    transform: translateX(-50%);

    display: none;

    border: none;

    border-radius: 999px;

    padding:
        clamp(12px, 2.5vw, 16px)
        clamp(22px, 5vw, 32px);

    background:
        rgba(255, 255, 255, 0.95);

    color: #d84f78;

    font-size:
        clamp(14px, 3.5vw, 18px);

    font-weight: 700;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.25);

    cursor: pointer;

    white-space: nowrap;

    z-index: 10;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

}


/* =========================
   BUTTON PRESS
========================= */

.back-button:active {

    transform:
        translateX(-50%)
        scale(0.96);

}


/* =========================
   TABLET / DESKTOP
========================= */

@media (min-width: 600px) {

    .back-button {

        bottom:
            calc(30px + env(safe-area-inset-bottom));

    }

}

</style>

</head>


<body>


<!-- =========================
     FINAL VIDEO
========================= -->

<video
    id="finalVideo"
    autoplay
    playsinline
    controls
    preload="auto"
>

    <source
        src="lv_7444471285444332853_20260929015309.mp4"
        type="video/mp4"
    >

    เบราว์เซอร์นี้ไม่รองรับวิดีโอ

</video>


<!-- =========================
     BACK BUTTON
========================= -->

<button
    id="backButton"
    class="back-button"
    onclick="goBack()"
>
    ← กลับไปหน้าความทรงจำ
</button>


<script>


/* =========================
   ELEMENTS
========================= */

const finalVideo =
    document.getElementById("finalVideo");

const backButton =
    document.getElementById("backButton");


/* =========================
   AUTOPLAY
========================= */

window.addEventListener("load", function () {

    finalVideo.play().catch(function () {

        /*
           หากเบราว์เซอร์บล็อก autoplay
           สามารถกด Play ได้
        */

    });

});


/* =========================
   VIDEO จบ
========================= */

finalVideo.addEventListener("ended", function () {

    backButton.style.display = "block";

});


/* =========================
   กลับหน้าความทรงจำ
========================= */

function goBack() {

    window.location.href =
        "page2.html";

}

</script>


</body>

</html>
