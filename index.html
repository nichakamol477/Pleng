<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>1 Month 💗</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Arial", sans-serif;
            background: linear-gradient(180deg, #ffbfd2, #ff8fb4);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
            position: relative;
        }

        /* รูปภาพ */
        .main-image {
            display: block;
            width: min(90%, 440px);
            height: auto;
            max-height: 400px;
            object-fit: cover;
            margin: 0 auto 25px;
            border-radius: 35px;
            box-shadow: 0 8px 25px rgba(150, 50, 90, 0.18);
        }

        /* Happy */
        .title {
            font-size: clamp(55px, 12vw, 100px);
            font-weight: bold;
            color: white;
            -webkit-text-stroke: 2px #e67aa2;
            text-shadow: 0 4px 0 #e67aa2;
            line-height: 1;
            margin-bottom: 25px;
        }

        /* 1 Month */
        .month {
            font-size: clamp(42px, 9vw, 75px);
            font-weight: bold;
            color: white;
            -webkit-text-stroke: 2px #7d74d8;
            text-shadow: 0 4px 0 #7d74d8;
            line-height: 1;
            margin-bottom: 20px;
        }

        /* หัวใจและประกาย */
        .sparkle {
            font-size: clamp(35px, 8vw, 55px);
            margin-bottom: 35px;
            letter-spacing: 8px;
        }

        /* กล่อง */
        .card {
            width: 100%;
            background: rgba(255, 247, 250, 0.95);
            border-radius: 45px;
            padding: 45px 35px;
            box-shadow: 0 10px 35px rgba(150, 50, 90, 0.12);
        }

        .card h2 {
            color: #e65b91;
            font-size: clamp(25px, 5vw, 35px);
            margin-bottom: 15px;
        }

        .subtitle {
            color: #d98ba9;
            font-size: clamp(16px, 4vw, 21px);
            margin-bottom: 30px;
        }

        /* ช่องรหัส */
        .password {
            width: 100%;
            height: 90px;
            border: 3px solid #f2a5c1;
            border-radius: 28px;
            background: #fff8fb;
            outline: none;
            text-align: center;
            font-size: clamp(25px, 6vw, 38px);
            letter-spacing: 14px;
            color: #e65b91;
            margin-bottom: 25px;
        }

        .password:focus {
            border-color: #ee6fa0;
            box-shadow: 0 0 0 4px rgba(238, 111, 160, 0.12);
        }

        /* ปุ่ม */
        .open-button {
            width: 100%;
            height: 85px;
            border: none;
            border-radius: 30px;
            background: #f45f91;
            color: white;
            font-size: clamp(20px, 5vw, 30px);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 7px 0 #d94b7b;
            transition: 0.15s;
        }

        .open-button:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #d94b7b;
        }

        .hint {
            margin-top: 35px;
            color: #d99ab2;
            font-size: clamp(14px, 3.5vw, 18px);
        }

        .error {
            color: #e84f78;
            font-size: 16px;
            margin-top: 15px;
            min-height: 22px;
        }

        /* หัวใจตกแต่ง */
        .heart {
            position: fixed;
            color: rgba(255, 255, 255, 0.7);
            font-size: 28px;
            pointer-events: none;
        }

        .heart1 {
            left: 8%;
            top: 28%;
        }

        .heart2 {
            right: 8%;
            top: 38%;
        }

        .heart3 {
            left: 12%;
            bottom: 15%;
        }

        .heart4 {
            right: 12%;
            bottom: 20%;
        }

        /* มือถือ */
        @media (max-width: 600px) {

            body {
                padding: 25px 12px;
            }

            .main-image {
                width: 88%;
                max-height: 330px;
                border-radius: 30px;
                margin-bottom: 22px;
            }

            .title {
                margin-bottom: 22px;
            }

            .month {
                margin-bottom: 15px;
            }

            .sparkle {
                margin-bottom: 30px;
                letter-spacing: 4px;
            }

            .card {
                padding: 38px 25px;
                border-radius: 40px;
            }

            .password {
                height: 75px;
                letter-spacing: 10px;
                border-radius: 24px;
            }

            .open-button {
                height: 75px;
                border-radius: 25px;
            }
        }

        /* จอเล็กมาก */
        @media (max-width: 380px) {

            body {
                padding: 20px 10px;
            }

            .main-image {
                width: 92%;
                border-radius: 25px;
            }

            .card {
                padding: 30px 18px;
            }

            .password {
                letter-spacing: 7px;
            }
        }
    </style>
</head>

<body>

    <!-- หัวใจตกแต่ง -->
    <div class="heart heart1">♡</div>
    <div class="heart heart2">♡</div>
    <div class="heart heart3">♡</div>
    <div class="heart heart4">♡</div>

    <div class="container">

        <!-- รูปอยู่ด้านบนสุด -->
        <img
            src="1788701156165.jpg"
            alt="Our memory"
            class="main-image"
        >

        <!-- Happy -->
        <div class="title">
            Happy
        </div>

        <!-- 1 Month -->
        <div class="month">
            1 Month
        </div>

        <!-- ตกแต่ง -->
        <div class="sparkle">
            ✨ 💗 ✨
        </div>

        <!-- กล่องใส่รหัส -->
        <div class="card">

            <h2>
                ครบรอบ 1 เดือน 💕
            </h2>

            <div class="subtitle">
                ยินดีต้อนรับเข้าสู่ความทรงจำของเรานะ
            </div>

            <input
                type="password"
                id="password"
                class="password"
                inputmode="numeric"
                maxlength="6"
                placeholder="••••••"
                autocomplete="off"
            >

            <button
                class="open-button"
                onclick="checkPassword()"
            >
                เปิดความทรงจำ 💗
            </button>

            <div
                id="error"
                class="error"
            ></div>

            <div class="hint">
                ใส่รหัส 6 หลักเพื่อไปหน้าถัดไป
            </div>

        </div>

    </div>

    <script>

        function checkPassword() {

            const password =
                document.getElementById("password").value;

            const error =
                document.getElementById("error");

            if (password === "310869") {

                window.location.href = "page2.html";

            } else {

                error.textContent =
                    "รหัสไม่ถูกต้อง ลองใหม่อีกครั้งนะ 💗";

            }
        }

        /* กด Enter เพื่อเปิด */
        document.getElementById("password")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    checkPassword();
                }

            });

    </script>

</body>
</html>
