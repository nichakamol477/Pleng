<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <!-- ทำให้เว็บปรับตามขนาดหน้าจอ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy 1 Month 💗</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                180deg,
                #ffc5d3 0%,
                #ff9fb8 100%
            );

            display: flex;
            justify-content: center;
            align-items: center;

            overflow-x: hidden;
            padding: clamp(20px, 5vw, 60px);
        }


        /* =========================
           หัวใจตกแต่ง
        ========================= */

        .heart {
            position: fixed;
            color: rgba(255,255,255,0.65);
            font-size: clamp(20px, 4vw, 35px);
            pointer-events: none;
        }

        .heart1 {
            top: 15%;
            left: 8%;
        }

        .heart2 {
            top: 25%;
            right: 8%;
        }

        .heart3 {
            bottom: 18%;
            left: 12%;
        }

        .heart4 {
            bottom: 12%;
            right: 15%;
        }


        /* =========================
           กล่องหลัก
        ========================= */

        .container {
            width: 100%;
            max-width: 520px;

            text-align: center;

            position: relative;
            z-index: 2;
        }


        /* =========================
           Happy
        ========================= */

        .title {
            font-size: clamp(48px, 13vw, 78px);

            line-height: 0.95;

            font-weight: 800;

            color: white;

            text-shadow:
                3px 3px 0 #d97896,
                -1px -1px 0 #d97896,
                1px -1px 0 #d97896,
                -1px 1px 0 #d97896;
        }


        /* =========================
           รูปภาพ
        ========================= */

        .main-image {
            display: block;

            width: min(65vw, 260px);

            max-width: 100%;

            height: auto;

            margin: clamp(12px, 3vw, 20px) auto;

            object-fit: contain;

            border-radius: 20px;

            filter: drop-shadow(
                0 8px 15px rgba(170, 70, 100, 0.18)
            );
        }


        /* =========================
           1 Month
        ========================= */

        .month {
            font-size: clamp(38px, 10vw, 65px);

            line-height: 1;

            font-weight: 700;

            color: white;

            text-shadow:
                3px 3px 0 #8f79c9,
                -1px -1px 0 #8f79c9,
                1px -1px 0 #8f79c9,
                -1px 1px 0 #8f79c9;
        }


        .sparkle {
            font-size: clamp(22px, 6vw, 35px);

            margin: clamp(10px, 2vw, 18px) 0;
        }


        /* =========================
           กล่องใส่รหัส
        ========================= */

        .card {
            width: 100%;

            padding: clamp(25px, 6vw, 40px)
                     clamp(18px, 5vw, 30px);

            margin-top: clamp(15px, 4vw, 25px);

            background: rgba(255, 245, 248, 0.92);

            border-radius: clamp(25px, 6vw, 38px);

            box-shadow:
                0 15px 40px rgba(180, 75, 105, 0.18);

            backdrop-filter: blur(10px);
        }


        .card h2 {
            color: #d45d7d;

            font-size: clamp(20px, 5vw, 27px);

            margin-bottom: 8px;
        }


        .card p {
            color: #d98ca2;

            font-size: clamp(13px, 3.5vw, 16px);

            margin-bottom: clamp(18px, 4vw, 25px);
        }


        /* =========================
           ช่องรหัส
        ========================= */

        .password {
            width: 100%;

            height: clamp(50px, 13vw, 60px);

            border: 2px solid #f2b2c4;

            border-radius: clamp(15px, 4vw, 22px);

            background: #fff0f5;

            text-align: center;

            font-size: clamp(20px, 6vw, 27px);

            letter-spacing: clamp(6px, 2vw, 12px);

            color: #c95478;

            outline: none;
        }


        .password:focus {
            border-color: #d97896;

            box-shadow:
                0 0 0 4px rgba(217,120,150,0.12);
        }


        .password::placeholder {
            color: #dfafbd;

            letter-spacing: clamp(5px, 2vw, 9px);
        }


        /* =========================
           ปุ่ม
        ========================= */

        button {
            width: 100%;

            height: clamp(48px, 12vw, 55px);

            margin-top: clamp(14px, 4vw, 20px);

            border: none;

            border-radius: clamp(15px, 4vw, 20px);

            background: #e87998;

            color: white;

            font-size: clamp(15px, 4vw, 18px);

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        button:hover {
            background: #d96182;

            transform: translateY(-2px);
        }


        /* =========================
           ข้อความรหัสผิด
        ========================= */

        .error {
            min-height: 22px;

            margin-top: 12px;

            color: #d94d70;

            font-size: clamp(12px, 3vw, 14px);

            font-weight: bold;
        }


        .hint {
            margin-top: 15px;

            color: #d89aaa;

            font-size: clamp(10px, 2.8vw, 13px);
        }


        /* =========================
           หน้าจอเล็กมาก
        ========================= */

        @media (max-width: 360px) {

            body {
                padding: 15px;
            }

            .main-image {
                width: 55vw;
            }

            .card {
                padding: 22px 16px;
            }

        }


        /* =========================
           แท็บเล็ต / คอม
        ========================= */

        @media (min-width: 768px) {

            .container {
                max-width: 600px;
            }

            .main-image {
                width: 280px;
            }

        }

    </style>
</head>


<body>

    <!-- ของตกแต่ง -->
    <div class="heart heart1">♡</div>
    <div class="heart heart2">♡</div>
    <div class="heart heart3">♡</div>
    <div class="heart heart4">♡</div>


    <main class="container">

        <!-- หัวข้อ -->
        <div class="title">
            Happy
        </div>


        <!-- รูปที่เพิ่มเข้ามา -->
        <img
            src="1788701156165.jpg"
            alt="Our memory"
            class="main-image"
        >


        <!-- ครบรอบ 1 เดือน -->
        <div class="month">
            1 Month
        </div>


        <div class="sparkle">
            ✨ 💗 ✨
        </div>


        <!-- กล่องรหัส -->
        <section class="card">

            <h2>
                ครบรอบ 1 เดือน 💕
            </h2>

            <p>
                ยินดีต้อนรับเข้าสู่ความทรงจำของเรานะ
            </p>


            <input
                id="password"
                class="password"
                type="password"
                inputmode="numeric"
                maxlength="6"
                placeholder="••••••"
                autocomplete="off"
            >


            <button onclick="checkPassword()">
                เปิดความทรงจำ 💗
            </button>


            <div id="error" class="error"></div>


            <div class="hint">
                ใส่รหัส 6 หลักเพื่อไปหน้าถัดไป
            </div>

        </section>

    </main>


    <script>

        function checkPassword() {

            const password =
                document.getElementById("password").value;

            const error =
                document.getElementById("error");

            const correctPassword = "310869";


            if (password === correctPassword) {

                // รหัสถูก → ไปหน้าที่ 2
                window.location.href = "page2.html";

            } else {

                // รหัสผิด → ไม่ไปหน้าต่อ
                error.textContent =
                    "รหัสไม่ถูกต้อง ลองใหม่อีกครั้งนะ 💗";

                document.getElementById("password").value = "";

            }
        }


        // กด Enter เพื่อยืนยันรหัส
        document
            .getElementById("password")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    checkPassword();
                }

            });

    </script>

</body>
</html>
